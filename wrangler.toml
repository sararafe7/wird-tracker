# ─────────────────────────────────────────────────────────────
# Wird — Cloudflare Pages configuration (Hasanat account)
# ─────────────────────────────────────────────────────────────

name = "wird"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1 database requested from Hasanat. Replace database_id with the id
# the maintainers send in the request note (it is not a secret).
# Local development works with the placeholder.
[[d1_databases]]
binding = "DB"
database_name = "wird-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
PUBLIC_SITE_URL = "https://wird.hasanat.dev"
PUBLIC_APP_NAME = "وِرد"
# Comma-separated emails that sign in as supervisor. Left empty here;
# the maintainers set the real value in Cloudflare.
SUPERVISOR_EMAILS = ""
