<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d5c56"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="256" cy="132" r="38" fill="white"/>
      <circle cx="273" cy="120" r="32" fill="black"/>
    </mask>
  </defs>
  <!-- Full-bleed background, so the icon also works as a maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Crescent -->
  <rect x="200" y="80" width="112" height="112" fill="#fff" mask="url(#crescent)"/>
  <!-- Open book: two pages meeting at the spine; everything stays inside the central safe zone -->
  <path d="M250 212 C214 190 168 184 128 192 L128 352 C168 344 214 350 250 374 Z" fill="#fff"/>
  <path d="M262 212 C298 190 344 184 384 192 L384 352 C344 344 298 350 262 374 Z" fill="#fff"/>
  <!-- Lines of text on the pages -->
  <g stroke="#a7d8d2" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M152 236 C180 230 208 234 228 244"/>
    <path d="M152 268 C180 262 208 266 228 276"/>
    <path d="M152 300 C180 294 208 298 228 308"/>
    <path d="M360 236 C332 230 304 234 284 244"/>
    <path d="M360 268 C332 262 304 266 284 276"/>
    <path d="M360 300 C332 294 304 298 284 308"/>
  </g>
</svg>
